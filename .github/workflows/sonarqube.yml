name: Tests and SonarQube

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  pull-requests: read

jobs:
  pull-request-tests:
    name: Pull request tests
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install coverage tool
        run: python -m pip install --disable-pip-version-check coverage

      - name: Run tests and create coverage report
        run: bash scripts/test.sh

  main-sonarqube-analysis:
    name: Main branch tests and SonarQube analysis
    if: github.event_name == 'push'
    runs-on: [self-hosted, linux, x64, sonar]
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install coverage tool
        run: python -m pip install --disable-pip-version-check coverage

      - name: Run tests and create coverage report
        run: bash scripts/test.sh

      - name: Run SonarQube analysis
        uses: SonarSource/sonarqube-scan-action@v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
